<script>
/* 每日一思：按日期轮换 + 当日固定洗牌 + localStorage 记忆 */
(function(){
  var box=document.getElementById('dailyQuiz');
  if(!box||typeof DAILY_QUIZ==='undefined'||!DAILY_QUIZ.length)return;
  var now=new Date();
  var day=Math.floor((now-now.getTimezoneOffset()*60000)/864e5);
  var quiz=DAILY_QUIZ[((day%DAILY_QUIZ.length)+DAILY_QUIZ.length)%DAILY_QUIZ.length];
  var lsKey='philo-quiz-'+day;
  var chosen=null;
  try{chosen=localStorage.getItem(lsKey);}catch(e){}
  var seed=day%2147483647;
  function rnd(){seed=(seed*48271)%2147483647;return seed/2147483647;}
  var order=quiz.o.map(function(_,i){return i;});
  for(var i=order.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=order[i];order[i]=order[j];order[j]=t;}
  var dateLabel=(now.getMonth()+1)+' 月 '+now.getDate()+' 日';
  var esc=function(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');};
  function render(selIdx){
    var html='<div class="quiz-label">今日一问 · '+dateLabel+'</div>'
      +'<div class="quiz-q">'+esc(quiz.q)+'</div>'
      +'<div class="quiz-opts">';
    for(var k=0;k<order.length;k++){
      var oi=order[k];var o=quiz.o[oi];
      var cls='quiz-opt'+(selIdx===null?'':(selIdx===oi?' chosen':' quiz-opt-done'));
      html+='<button type="button" class="'+cls+'" data-i="'+oi+'"'+(selIdx!==null?' disabled':'')+'>'+esc(o.t)+'</button>';
    }
    html+='</div>';
    if(selIdx!==null){
      var o=quiz.o[selIdx];
      html+='<div class="quiz-result">'
        +'<img src="images/thumb/'+encodeURIComponent(o.p)+'.jpg" alt="'+esc(o.p)+'" loading="lazy">'
        +'<div class="quiz-result-body"><h4>你的判断，接近 '+esc(o.p)+' 的思想</h4>'
        +'<p>'+esc(o.d)+'</p>'
        +'<a href="'+encodeURIComponent(o.p)+'/index.html">阅读 '+esc(o.p)+' 的完整导读 →</a>'
        +'</div></div>'
        +'<div class="quiz-foot"><button type="button" class="quiz-redo" id="quizRedo">重新作答</button><span>明天换一题</span></div>';
    }else{
      html+='<div class="quiz-foot"><span>选一位哲学家，看看你与谁同行</span></div>';
    }
    box.innerHTML=html;
    var btns=box.querySelectorAll('.quiz-opt');
    for(var b=0;b<btns.length;b++){
      btns[b].addEventListener('click',function(){
        var idx=parseInt(this.getAttribute('data-i'),10);
        try{localStorage.setItem(lsKey,idx);}catch(e){}
        render(idx);
      });
    }
    var redo=document.getElementById('quizRedo');
    if(redo){
      redo.addEventListener('click',function(){
        try{localStorage.removeItem(lsKey);}catch(e){}
        render(null);
      });
    }
  }
  render(chosen===null?null:parseInt(chosen,10));
})();
</script>
<script>
const obs=new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting)e.target.classList.add('in');});},{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>obs.observe(el));
const toTop=document.querySelector('.to-top');
window.addEventListener('scroll',()=>{if(window.scrollY>400)toTop.classList.add('show');else toTop.classList.remove('show');});
(function(){
  var fab=document.getElementById('tool-fab');
  if(!fab)return;
  var btns=fab.querySelectorAll('button');
  btns.forEach(function(b){b.classList.add('show');});
  var toTopBtn=document.querySelector('.to-top');
  if(toTopBtn){
    window.addEventListener('scroll',function(){if(window.scrollY>400)toTopBtn.classList.add('show');else toTopBtn.classList.remove('show');});
  }
  var zoomLevel=100;
  var html=document.documentElement;
  var fabEl=document.getElementById('tool-fab');
  var toTop=document.querySelector('.to-top');
  var ZOOM_STEPS=[75,100,125,150];
  function applyZoom(){
    html.style.zoom=zoomLevel+'%';
    var rev=(100/zoomLevel*100).toFixed(2)+'%';
    if(fabEl)fabEl.style.zoom=rev;
    if(toTop)toTop.style.zoom=rev;
    document.body.classList.toggle('zoomed',zoomLevel>100);
  }
  var saved=localStorage.getItem('philo-zoom');
  if(saved){zoomLevel=parseInt(saved);applyZoom();}
  document.getElementById('font-increase').addEventListener('click',function(){
    var idx=ZOOM_STEPS.indexOf(zoomLevel);
    if(idx<ZOOM_STEPS.length-1){zoomLevel=ZOOM_STEPS[idx+1];applyZoom();localStorage.setItem('philo-zoom',zoomLevel);}
  });
  document.getElementById('font-decrease').addEventListener('click',function(){
    var idx=ZOOM_STEPS.indexOf(zoomLevel);
    if(idx>0){zoomLevel=ZOOM_STEPS[idx-1];applyZoom();localStorage.setItem('philo-zoom',zoomLevel);}
  });
  var dt=document.getElementById('dark-toggle');
  if(localStorage.getItem('philo-dark')==='1'){document.body.classList.add('dark');dt.classList.add('active');}
  dt.addEventListener('click',function(){
    document.body.classList.toggle('dark');var on=document.body.classList.contains('dark');
    dt.classList.toggle('active',on);localStorage.setItem('philo-dark',on?'1':'0');
  });
})();
</script>
